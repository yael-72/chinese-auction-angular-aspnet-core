<div class="gift-spinner-wrapper" [class.active]="isLoading">
  <div class="spinner-container">
    <!-- Orbiting gifts -->
    <div class="orbit-item orbit-1">
      <i class="pi pi-gift"></i>
    </div>
    <div class="orbit-item orbit-2">
      <i class="pi pi-gift"></i>
    </div>
    <div class="orbit-item orbit-3">
      <i class="pi pi-gift"></i>
    </div>
    <div class="orbit-item orbit-4">
      <i class="pi pi-gift"></i>
    </div>
    
    <!-- Center spinning circle -->
    <div class="center-spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring-2"></div>
      <div class="center-dot">
        <i class="pi pi-star-fill"></i>
      </div>
    </div>
  </div>
  
  <!-- Loading text -->
  <!-- <p class="spinner-text" *ngIf="isLoading">הגרלה בעיצומה...</p> -->
</div>
